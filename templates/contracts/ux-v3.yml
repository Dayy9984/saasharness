version: 3
primary_journey:
  id: first-value
  goal: User reaches the product's first meaningful value
  entry: landing
  success: value-delivered
  states: [loading, empty, error, success, permission, paid-limit]

ia:
  top_level_objects: []
  primary_navigation: []
  recovery_paths: []

ui_foundation:
  soul_file: SOUL.md
  status: draft
  default: clean-b2c-saas
  product_character: ""
  density: standard
  surface_treatment: solid-neutral
  button_treatment: solid-primary
  references: [apple-principles, linear-principles, miro-principles, stripe-principles, notion-principles]
  anti_references: [novelty-theme, decorative-glass-everywhere, decorative-bounce, low-contrast]

ui_treatment_exploration:
  source: public-research-including-pinterest
  research_method: authorized-browser-research
  automated_scraping: forbidden
  candidate_count: 15
  canonical_screen: standard-b2c-saas-screen
  same_ia_layout_and_flow: true
  allowed_axes: [button-material, surface-depth, density, radius, accent, focus, motion]
  realistic_mock_data: false
  gallery_route: /__ux/themes
  status: draft

theme_selection:
  theme_id: ""
  status: draft
  approval_artifact: artifacts/02-ux/theme-selection.yml

design:
  component_system: modular
  source_of_truth: SOUL.md
  responsive_approval: human-in-react-mock

motion:
  system: spring
  tokens: [instant, snappy, smooth, gentle]
  reduced_motion: required

react_mock:
  route: /__ux/prototype
  status: draft
  fixture_states: [ready, loading, empty, error, paid-limit]
  starts_after_theme_approval: true
  all_pages_required_before_implementation: true
  responsive_behavior_completed_before_implementation: true

usability_evidence:
  status: not-validated
  source: none

approval:
  status: draft
  approved_by: product-owner
