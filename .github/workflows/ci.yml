name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  generated-starter:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./bin/saasharness.js assemble ./examples/demo --out ./.tmp/demo
      - run: npm install
        working-directory: ./.tmp/demo
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ./.tmp/demo
      - run: npm run check
        working-directory: ./.tmp/demo
      - run: npm test
        working-directory: ./.tmp/demo
      - run: npx playwright install --with-deps chromium
        working-directory: ./.tmp/demo
      - run: npm run test:e2e
        working-directory: ./.tmp/demo
